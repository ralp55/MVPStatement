spring:
  application:
    name: statement
  datasource:
    url: jdbc:postgresql://localhost:5433/NeoDBmvp
    username: postgres
    password: 1
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml


server:
  port: 8081

external:
  deal-service:
    base-url: http://localhost:8081
    endpoints:
      statement: /deal/statement
      offer-select: /deal/offer/select
